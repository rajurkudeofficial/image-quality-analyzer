services:
  - type: web
    name: image-quality-analyzer-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: ENHANCEMENT_BACKEND
        value: classical
      - key: CORS_ORIGINS
        value: https://rajurkudeofficial.github.io
